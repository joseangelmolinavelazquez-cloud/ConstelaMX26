<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias, Constela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
a:hover{opacity:0.85}
a:focus-visible,button:focus-visible{outline:2px solid #8FA2FF;outline-offset:3px}
input:focus-visible,textarea:focus-visible{outline:2px solid #8FA2FF;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8A93B8;opacity:1}
.opt:has(input:checked){border-color:#8FA2FF;background:rgba(143,162,255,0.10)}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; background: #0A0E1F; color: #EEF1FF; font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 48px 24px; text-align: center">
<div style="font-size: 18px; font-weight: 300; letter-spacing: 0.32em">CONSTELA</div>
<h1 style="margin: 0; font-size: clamp(30px, 5vw, 44px); font-weight: 300; line-height: 1.15">Gracias, recibimos tu mensaje</h1>
<p style="margin: 0; font-size: 18px; line-height: 28px; color: #8A93B8; max-width: 520px">Revisaremos lo que nos cuentas y te respondemos pronto con una propuesta.</p>
<a href="/" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: 8px; background: #8FA2FF; color: #0A0E1F; font-size: 16px; font-weight: 600">Volver al inicio</a>
</div>
</body>
</html>
